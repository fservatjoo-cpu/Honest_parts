<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin - Honest Ride Parts</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; background: #f4f5f7; color: #1c1e21; }
  header { background: #12263f; color: #fff; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 8px; padding: 10px 16px; }
  .primary { background: #e8590c; color: #fff; font-weight: 600; }
  .secondary { background: #e4e6eb; color: #1c1e21; }
  .danger { background: #fff; color: #c92a2a; border: 1px solid #c92a2a; }
  .login { max-width: 360px; margin: 60px auto; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  label { display: block; font-weight: 600; margin: 14px 0 6px; }
  input, textarea, select { width: 100%; font: inherit; padding: 10px; border: 1px solid #bbb; border-radius: 8px; background: #fff; }
  textarea { min-height: 110px; resize: vertical; }
  .hint { font-size: 13px; color: #666; margin-top: 4px; }
  .msg { margin-top: 12px; font-size: 14px; }
  .msg.err { color: #c92a2a; }
  .msg.ok { color: #2b8a3e; }
  .list { display: grid; gap: 12px; margin-top: 16px; }
  .row { background: #fff; border-radius: 12px; padding: 12px; display: flex; gap: 14px; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .row img, .row .noimg { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; background: #dde0e5; flex: none; }
  .row .noimg { display: flex; align-items: center; justify-content: center; color: #888; font-size: 12px; }
  .row .info { flex: 1; min-width: 0; }
  .row .info strong { display: block; }
  .row .info span { font-size: 13px; color: #666; }
  .row .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  dialog { border: 0; border-radius: 14px; padding: 22px; width: min(560px, 94vw); max-height: 92vh; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog h2 { margin: 0 0 4px; }
  .preview { margin-top: 10px; max-width: 100%; max-height: 220px; border-radius: 8px; display: none; }
  .actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
  .empty { text-align: center; color: #666; padding: 30px; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-weight: 400; }
  .check input { width: auto; }
</style>
</head>
<body>

<!-- ======= SET THIS ONE LINE (your Worker address, no slash at the end) ======= -->
<script>const API = "https://hrp-items.fservatjoo.workers.dev";</script>

<div id="loginView" class="login">
  <h2 style="margin-top:0">Admin login</h2>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password">
  <div style="margin-top:16px"><button id="loginBtn" class="primary">Log in</button></div>
  <div id="loginMsg" class="msg"></div>
</div>

<div id="appView" style="display:none">
  <header>
    <h1>Honest Ride Parts - My items</h1>
    <div>
      <button id="addBtn" class="primary">+ Add item</button>
      <button id="logoutBtn" class="secondary">Log out</button>
    </div>
  </header>
  <main>
    <div class="hint">Items you add here appear on your website right away (it can take up to one minute).</div>
    <div id="list" class="list"></div>
  </main>
</div>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlgTitle">Add item</h2>

    <label for="fTitle">Title</label>
    <input id="fTitle" maxlength="120" required>

    <label for="fCategory">Page / category</label>
    <input id="fCategory" list="cats" value="accessories">
    <datalist id="cats"><option value="accessories"><option value="cars"><option value="tools"></datalist>
    <div class="hint">The page shows only items with its own category name. Example: accessories or cars.</div>

    <label for="fDesc">Description</label>
    <textarea id="fDesc" maxlength="3000"></textarea>

    <label for="fLink">Buy link (optional)</label>
    <input id="fLink" type="url" placeholder="https://...">
    <div class="hint">Your Amazon / eBay affiliate link.</div>

    <label for="fVideo">YouTube link (optional)</label>
    <input id="fVideo" type="url" placeholder="https://www.youtube.com/watch?v=...">

    <label for="fImage">Photo (optional)</label>
    <input id="fImage" type="file" accept="image/*">
    <img id="preview" class="preview" alt="Preview">
    <label id="removeRow" class="check" style="display:none"><input type="checkbox" id="fRemove"> Remove the current photo</label>

    <div id="formMsg" class="msg"></div>
    <div class="actions">
      <button type="button" id="cancelBtn" class="secondary">Cancel</button>
      <button type="submit" id="saveBtn" class="primary">Save</button>
    </div>
  </form>
</dialog>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var token = "";
  try { token = sessionStorage.getItem("hrp_token") || ""; } catch (e) {}
  var items = [];
  var editingId = null;
  var newImage = ""; // data URL of a newly chosen photo

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function api(path, body) {
    return fetch(API + path, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify(body || {})
    }).then(function (r) {
      return r.json().then(function (data) {
        if (!r.ok) throw new Error(data.error || "Something went wrong");
        return data;
      });
    });
  }

  function showApp() {
    $("loginView").style.display = "none";
    $("appView").style.display = "block";
    load();
  }

  function showLogin() {
    $("appView").style.display = "none";
    $("loginView").style.display = "block";
  }

  function load() {
    fetch(API + "/items?_=" + Date.now()).then(function (r) { return r.json(); }).then(function (data) {
      items = Array.isArray(data) ? data : [];
      render();
    }).catch(function () {
      $("list").innerHTML = '<div class="empty">Could not load items. Check the API address.</div>';
    });
  }

  function render() {
    if (!items.length) {
      $("list").innerHTML = '<div class="empty">No items yet. Click "+ Add item".</div>';
      return;
    }
    $("list").innerHTML = items.map(function (it) {
      var pic = it.image ? '<img src="' + esc(it.image) + '" alt="">' : '<div class="noimg">No photo</div>';
      return '<div class="row">' + pic +
        '<div class="info"><strong>' + esc(it.title) + '</strong><span>Page: ' + esc(it.category) + '</span></div>' +
        '<div class="btns"><button class="secondary" data-edit="' + esc(it.id) + '">Edit</button>' +
        '<button class="danger" data-del="' + esc(it.id) + '">Delete</button></div></div>';
    }).join("");
  }

  // ----- login -----
  function doLogin() {
    token = $("pw").value;
    $("loginMsg").textContent = "";
    api("/admin/login").then(function () {
      try { sessionStorage.setItem("hrp_token", token); } catch (e) {}
      showApp();
    }).catch(function (e) {
      $("loginMsg").className = "msg err";
      $("loginMsg").textContent = e.message;
    });
  }
  $("loginBtn").addEventListener("click", doLogin);
  $("pw").addEventListener("keydown", function (e) { if (e.key === "Enter") doLogin(); });
  $("logoutBtn").addEventListener("click", function () {
    token = "";
    try { sessionStorage.removeItem("hrp_token"); } catch (e) {}
    $("pw").value = "";
    showLogin();
  });

  // ----- open the box (dialog) -----
  function openForm(item) {
    editingId = item ? item.id : null;
    newImage = "";
    $("dlgTitle").textContent = item ? "Edit item" : "Add item";
    $("fTitle").value = item ? item.title : "";
    $("fCategory").value = item ? item.category : "accessories";
    $("fDesc").value = item ? item.description : "";
    $("fLink").value = item ? item.link : "";
    $("fVideo").value = item ? item.video : "";
    $("fImage").value = "";
    $("fRemove").checked = false;
    $("removeRow").style.display = item && item.image ? "flex" : "none";
    var pv = $("preview");
    if (item && item.image) { pv.src = item.image; pv.style.display = "block"; }
    else { pv.removeAttribute("src"); pv.style.display = "none"; }
    $("formMsg").textContent = "";
    $("saveBtn").disabled = false;
    $("dlg").showModal();
  }
  $("addBtn").addEventListener("click", function () { openForm(null); });
  $("cancelBtn").addEventListener("click", function () { $("dlg").close(); });

  $("list").addEventListener("click", function (e) {
    var ed = e.target.getAttribute("data-edit");
    var dl = e.target.getAttribute("data-del");
    if (ed) {
      var it = items.filter(function (x) { return x.id === ed; })[0];
      if (it) openForm(it);
    } else if (dl) {
      if (confirm("Delete this item?")) {
        api("/admin/delete", { id: dl }).then(function () {
          items = items.filter(function (x) { return x.id !== dl; });
          render();
        }).catch(function (err) { alert(err.message); });
      }
    }
  });

  // ----- shrink the photo before sending (fast + small) -----
  function shrink(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error("Could not read the photo")); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error("This file is not a photo")); };
        img.onload = function () {
          var max = 900;
          var scale = Math.min(1, max / Math.max(img.width, img.height));
          var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          var c = document.createElement("canvas");
          c.width = w; c.height = h;
          var ctx = c.getContext("2d");
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL("image/jpeg", 0.82));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  $("fImage").addEventListener("change", function () {
    var f = this.files[0];
    if (!f) return;
    shrink(f).then(function (data) {
      newImage = data;
      $("preview").src = data;
      $("preview").style.display = "block";
      $("formMsg").textContent = "";
    }).catch(function (e) {
      newImage = "";
      $("formMsg").className = "msg err";
      $("formMsg").textContent = e.message;
    });
  });

  // ----- save -----
  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    $("saveBtn").disabled = true;
    $("formMsg").className = "msg";
    $("formMsg").textContent = "Saving...";
    var body = {
      id: editingId,
      title: $("fTitle").value,
      category: $("fCategory").value,
      description: $("fDesc").value,
      link: $("fLink").value,
      video: $("fVideo").value
    };
    if (newImage) body.image = newImage;
    else if ($("fRemove").checked) body.removeImage = true;

    api("/admin/save", body).then(function () {
      $("dlg").close();
      load();
    }).catch(function (err) {
      $("saveBtn").disabled = false;
      $("formMsg").className = "msg err";
      $("formMsg").textContent = err.message;
    });
  });

  // ----- start -----
  if (token) {
    api("/admin/login").then(showApp).catch(showLogin);
  } else {
    showLogin();
  }
})();
</script>
</body>
</html>
